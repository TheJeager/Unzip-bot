<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="ArchiveX animated banner">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#0b1638"/><stop offset="1" stop-color="#02040c"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#5ee7ff" stop-opacity=".85"/><stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="text" x1="0" x2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#9defff"/><stop offset="1" stop-color="#6d7cff"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<circle cx="950" cy="205" r="190" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="r" values="150;205;150" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".45;.85;.45" dur="4s" repeatCount="indefinite"/>
</circle>
<g fill="none" stroke="#65e7ff" opacity=".2">
  <circle cx="950" cy="205" r="105"><animate attributeName="r" values="85;150;85" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="950" cy="205" r="155"><animate attributeName="r" values="155;205;155" dur="6s" repeatCount="indefinite"/></circle>
</g>
<g fill="#b8f5ff">
  <circle cx="820" cy="80" r="2"><animate attributeName="cy" values="80;50;80" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="320" r="2"><animate attributeName="cx" values="1080;1120;1080" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="285" r="1.5"><animate attributeName="cy" values="285;255;285" dur="2.2s" repeatCount="indefinite"/></circle>
</g>
<path d="M765 208 C820 150 875 150 930 208 S1040 266 1095 208" fill="none" stroke="#6be9ff" stroke-width="2" opacity=".55">
  <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M765 208 C820 150 875 150 930 208 S1040 266 1095 208;M765 208 C820 266 875 266 930 208 S1040 150 1095 208;M765 208 C820 150 875 150 930 208 S1040 266 1095 208"/>
</path>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="78" y="120" fill="#79eaff" font-size="16" font-weight="700" letter-spacing="5">TELEGRAM • ARCHIVE PROCESSING</text>
  <text x="75" y="205" fill="url(#text)" font-size="76" font-weight="800" letter-spacing="-3">ArchiveX</text>
  <text x="80" y="247" fill="#b7c8e8" font-size="20">Secure extraction. Async workers. Zero clutter.</text>
  <g transform="translate(80 285)">
    <rect width="135" height="42" rx="21" fill="#10264d" stroke="#2f9fff" opacity=".9"/>
    <text x="67" y="27" text-anchor="middle" fill="#c9f8ff" font-size="14" font-weight="700">LIMITLESS QUEUE</text>
    <rect x="150" width="128" height="42" rx="21" fill="#10264d" stroke="#697cff" opacity=".9"/>
    <text x="214" y="27" text-anchor="middle" fill="#d9dcff" font-size="14" font-weight="700">SECURE CORE</text>
  </g>
</g>
<rect x="1" y="1" width="1198" height="418" rx="28" fill="none" stroke="#31507e" opacity=".55"/>
</svg>