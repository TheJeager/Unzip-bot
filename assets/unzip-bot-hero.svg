<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#101a3a"/><stop offset="1" stop-color="#061827"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55dfff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#7b7dff"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1400" height="420" rx="28" fill="url(#bg)"/>
<g opacity=".25" filter="url(#blur)">
<circle cx="1120" cy="210" r="115" fill="#55dfff"><animate attributeName="r" values="95;135;95" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="290" cy="120" r="80" fill="#7b7dff"><animate attributeName="r" values="65;100;65" dur="5s" repeatCount="indefinite"/></circle>
</g>
<g fill="none" stroke="url(#glow)" opacity=".55">
