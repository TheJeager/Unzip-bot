<circle cx="1120" cy="210" r="160" stroke-dasharray="5 16"><animateTransform attributeName="transform" type="rotate" from="0 1120 210" to="360 1120 210" dur="18s" repeatCount="indefinite"/></circle>
</g>
<g fill="#fff" opacity=".8">
<circle cx="150" cy="80" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="470" cy="330" r="2"><animate attributeName="opacity" values=".1;.9;.1" dur="2.8s" repeatCount="indefinite"/></circle>
<circle cx="920" cy="70" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="1260" cy="330" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2.4s" repeatCount="indefinite"/></circle>
</g>
<text x="110" y="190" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="2">UNZIP BOT</text>
<text x="114" y="245" fill="#a9dff0" font-family="Inter,Arial,sans-serif" font-size="25">Fast • Secure • Asynchronous Telegram Archive Extraction</text>
